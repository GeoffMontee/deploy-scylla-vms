---
- name: Replace one dead ScyllaDB node on its new stable logical target
  hosts: scylla
  gather_facts: true
  become: true
  strategy: linear
  serial: 1
  any_errors_fatal: true
  max_fail_percentage: 0
  tags:
    - scylla-replace-dead

  pre_tasks:
    - name: Emit truthful replacement check-mode refusal
      ansible.builtin.debug:
        msg: >-
          DSV_SCYLLA_REPLACE_DEAD_B64={{
            {
              'schema_version':
                'deploy-scylla-vms.ansible-scylla-replace-dead/v1',
              'status': 'not-predicted',
              'stable_id': inventory_hostname,
              'old_provider_id_digest':
                deploy_scylla_vms_scylla_replace_dead.old_provider_id_digest,
              'new_provider_id_digest':
                deploy_scylla_vms_scylla_replace_dead.new_provider_id_digest,
              'old_host_id_digest':
                'sha256:' + (
                  deploy_scylla_vms_scylla_replace_dead.old_host_id
                  | hash('sha256')
                ),
              'new_host_id_digest': none,
              'pre_evidence_digest':
                deploy_scylla_vms_scylla_replace_dead.pre_evidence_digest,
              'post_evidence_digest': none,
              'config_digest':
                deploy_scylla_vms_scylla_replace_dead.config_digest,
              'storage_digest':
                deploy_scylla_vms_scylla_replace_dead.storage_digest,
              'topology_digest':
                deploy_scylla_vms_scylla_replace_dead.topology_digest,
              'intended_post_state_digest':
                deploy_scylla_vms_scylla_replace_dead.intended_post_state_digest,
              'mutation_boundary': 'not-started',
              'streaming_status': 'not-checked',
              'ring_status': 'not-checked',
              'replacement_key_retained': false,
              'repair_required':
                deploy_scylla_vms_scylla_replace_dead.repair_required,
              'rbno_status': (
                'enabled-complete'
                if (
                  deploy_scylla_vms_scylla_replace_dead.rbno.enabled
                  and deploy_scylla_vms_scylla_replace_dead.rbno.complete
                )
                else 'repair-required'
              ),
              'postconditions': {
                'expected-topology': 'not-performed',
                'new-host-id': 'not-performed',
                'no-streaming': 'not-performed',
                'old-host-id-absent': 'not-performed',
                'replacement-up-normal': 'not-performed',
                'schema-agreement': 'not-performed'
              },
              'recovery_required': false,
              'blockers': []
            }
            | to_json
            | b64encode
          }}
      when: ansible_check_mode
      changed_when: false
      tags:
        - always

    - name: Hard refuse replacement prediction in check mode
      ansible.builtin.fail:
        msg: >-
          Dead-node replacement check mode is refused because the one-time
          configuration and membership mutation cannot be safely predicted.
      when: ansible_check_mode
      tags:
        - always

    - name: Validate exact replacement target authorization
      ansible.builtin.assert:
        that:
          - deploy_scylla_vms_role == 'scylla'
          - deploy_scylla_vms_logical_id == inventory_hostname
          - deploy_scylla_vms_host_key_checking_required is sameas true
          - deploy_scylla_vms_scylla_replace_dead is mapping
          - >-
            deploy_scylla_vms_scylla_replace_dead.schema_version ==
            'deploy-scylla-vms.ansible-scylla-replace-dead/v1'
          - >-
            deploy_scylla_vms_scylla_replace_dead.stable_id ==
            inventory_hostname
          - deploy_scylla_vms_scylla_replace_dead.authorization.reviewed
          - >-
            deploy_scylla_vms_scylla_replace_dead.required_survivor_quorum
            | length > 0
          - ansible_facts.distribution == 'Ubuntu'
          - ansible_facts.distribution_version == '24.04'
          - ansible_facts.os_family == 'Debian'
        quiet: true
        fail_msg: >-
          Replacement must run only on the exact newly provisioned stable
          logical target with reviewed digest-bound authorization.
      changed_when: false
      no_log: true
      tags:
        - always
        - preflight

  roles:
    - role: scylla_replace_dead
      tags:
        - scylla-replace-dead

  post_tasks:
    - name: Emit strict normalized replacement evidence
      ansible.builtin.debug:
        msg: >-
          DSV_SCYLLA_REPLACE_DEAD_B64={{
            scylla_replace_dead_result | to_json | b64encode
          }}
      changed_when: >-
        scylla_replace_dead_result.mutation_boundary != 'not-started'
      tags:
        - always

    - name: Stop after preserving replacement recovery evidence
      ansible.builtin.fail:
        msg: >-
          Dead-node replacement did not prove all postconditions. Never run
          removenode, force, destroy, wipe, or blindly restart; preserve the
          one-time key and state for recovery review.
      when: scylla_replace_dead_result.status == 'failed'
      no_log: true
      tags:
        - always
