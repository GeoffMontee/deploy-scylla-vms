  official_notes:
    - >-
      PLAN base-os enables and starts only systemd-timesyncd after generic
      APT prerequisites. That is the only reviewed generic start.
    - >-
      PLAN names systemd unmask/start of scylla-server as the irreversible
      scylla-bootstrap boundary. service-converge never crosses it.
    - >-
      Manager 3.12 agent and server slices leave scylla-manager-agent
      disabled/inactive and scylla-manager masked/inactive. No reviewed
      bind, token, backend, or start path exists.
    - >-
      monitoring-agent leaves scylla-node-exporter disabled/inactive because
      starting it would bind port 9100. monitoring-stack and
      monitoring-targets remain not-started.
    - >-
      jump-host-configure reloads Ubuntu ssh after a validated drop-in
      change. service-converge does not restart ssh.
    - >-
      PLAN service-converge is later service-scope reconcile/restart, but
      it does not define a safe start allowlist for already-bootstrapped
      Scylla, Manager, exporters, or the monitoring stack.
verification:
  - >-
    This slice validates Ubuntu 24.04, current base-os, and
    role-appropriate current install evidence only.
  - >-
    The host module may enable/start or restart only
    systemd-timesyncd.service. restart_policy never authorizes another
    unit.
  - >-
    Forbidden units succeed only when already-correct masked or
    disabled/inactive states match. Active or unmasked states fail
    closed without stop, start, unmask, or restart.
  - >-
    monitoring-stack and monitoring-targets have an empty unit set and
    report stack, docker, container, and exporter starts as
    not-performed.
  - Refuse package install, config rewrite, firewall, SSH, secrets, and
    Terraform.
