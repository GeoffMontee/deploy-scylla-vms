  official_release_line: "3.12"
  official_service_unit: scylla-manager.service
  official_default_api_url: http://127.0.0.1:5080/api/v1
  official_commands:
    inspect: sctool tasks
    quiesce: sctool suspend --cluster <id|name>
    resume: sctool resume --cluster <id|name>
    repair_create: sctool repair
    backup_create: sctool backup
  official_task_kinds:
    - backup
    - repair
  official_notes:
    - >-
      sctool tasks lists scheduled tasks for a registered cluster and talks
      to the Manager API. The default API URL is derived from
      /etc/scylla-manager/scylla-manager.yaml or
      http://127.0.0.1:5080/api/v1.
    - >-
      sctool suspend --cluster stops running tasks and cancels scheduled
      tasks. Health-check tasks continue. Resume uses
      sctool resume --cluster.
    - >-
      Registering a cluster automatically schedules a weekly repair task.
      Backup tasks require sctool backup plus a storage location.
    - >-
      The current manager-server slice is install-only. scylla-manager is
      masked and inactive, no backend or cluster is registered, and no
      auth token is written.
