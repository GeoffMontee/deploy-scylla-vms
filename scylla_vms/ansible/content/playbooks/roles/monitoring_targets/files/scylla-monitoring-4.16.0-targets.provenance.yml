verification:
  - >-
    Official Scylla Monitoring 4.16.0 file-SD uses prometheus/scylla_servers.yml
    with RFC1918-or-cluster IPs, cluster and dc labels, and no default scrape
    ports. Prometheus relabel adds Scylla 9180, node_exporter 9100, and
    manager_agent 5090.
  - >-
    Official docs require prometheus/scylla_manager_servers.yml even when
    Manager is unused. When Manager exists, the documented form is
    host:5090 without labels.
  - >-
    Official start-all.sh reuses scylla_servers.yml for node_exporter and
    manager_agent unless a distinct file is supplied. This slice writes the
    same official YAML under the documented names so default startup and
    --target-directory both see complete files.
  - >-
    Official genconfig.py emits the same scylla_servers.yml schema from DC/IP
    groups. This slice generates that schema from validated inventory
    identities instead of nodetool status or host-side genconfig.py.
  - >-
    Vector-search target files are official only with an explicit vector
    service; this baseline does not write vector_search_servers.yml.
  - Refuse Consul manager discovery, start-all.sh, Compose, Docker, Grafana
    auth, public bind, secrets, and live scrape claims.
  - >-
    Exporters and the stack remain not-started after monitoring-agent and
    monitoring-stack. Generated files are valid, but scrape-readiness stays
    not-performed.
