decisions:
  - >-
    PLAN defines only the current Ubuntu 24.04 baseline, not an approved target
    transition.
  - >-
    Same-release requests are classified undefined and every other target
    unsupported.
  - >-
    Kernel release and repository-state policies remain undefined and block
    readiness.
  - >-
    Package currency is package-currency-not-performed because this read-only
    slice does not refresh APT metadata.
  - >-
    Free-space thresholds are required as separately validated digest-bound
    input.
  - >-
    Provider image facts are caller-supplied offline evidence; this slice never
    contacts OCI.
  - >-
    This slice runs no apt update, apt upgrade, do-release-upgrade, reboot,
    service change, Terraform, or VM replacement.
