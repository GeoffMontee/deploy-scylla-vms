---
- name: Install exact ScyllaDB Manager agent without configuration or startup
  hosts: scylla
  gather_facts: true
  become: true
  strategy: linear
  serial: 1
  any_errors_fatal: true
  max_fail_percentage: 0
  tags:
    - manager-agent

  pre_tasks:
    - name: Validate exact agent install intent and supported guest
      ansible.builtin.assert:
        that:
          - inventory_hostname == deploy_scylla_vms_logical_id
          - deploy_scylla_vms_role == 'scylla'
          - deploy_scylla_vms_host_key_checking_required is sameas true
          - deploy_scylla_vms_manager_agent is mapping
          - >-
            deploy_scylla_vms_manager_agent.schema_version ==
            'deploy-scylla-vms.ansible-manager-agent/v1'
          - >-
            deploy_scylla_vms_manager_agent.logical_id ==
            inventory_hostname
          - deploy_scylla_vms_manager_agent.channel == 'stable'
          - deploy_scylla_vms_manager_agent.release_line == '3.12'
          - >-
            deploy_scylla_vms_manager_agent.configuration_performed
            is sameas false
          - >-
            deploy_scylla_vms_manager_agent.auth_token_configured
            is sameas false
          - >-
            deploy_scylla_vms_manager_agent.helper_slice_configured
            is sameas false
          - >-
            deploy_scylla_vms_manager_agent.server_reachability ==
            'not-performed'
          - >-
            deploy_scylla_vms_manager_agent.package_version
            is match(
              '^3[.]12[.](0|[1-9][0-9]*)~0[.][0-9]{8}'
              '[.][0-9a-f]{7,12}$'
            )
          - >-
            deploy_scylla_vms_manager_agent.image_operating_system ==
            'Ubuntu'
          - >-
            deploy_scylla_vms_manager_agent.image_operating_system_version ==
            '24.04'
          - ansible_facts.distribution == 'Ubuntu'
          - ansible_facts.distribution_version == '24.04'
          - ansible_facts.os_family == 'Debian'
          - >-
            (
              deploy_scylla_vms_manager_agent.architecture == 'amd64'
              and ansible_facts.architecture == 'x86_64'
            )
            or
            (
              deploy_scylla_vms_manager_agent.architecture == 'aarch64'
              and ansible_facts.architecture == 'aarch64'
            )
          - >-
            deploy_scylla_vms_manager_agent.signing_key.fingerprint ==
            '6C6ECC84F42AF147BD2A65AEC503C686B007F39E'
          - >-
            deploy_scylla_vms_manager_agent.signing_key.artifact_digest ==
            'sha256:f2f1f4368a71820ea1f5e4e8900e59ddeec1e78cf98450f3ac84826c828ea417'
          - >-
            deploy_scylla_vms_manager_agent.signing_key.resource ==
            'content/playbooks/roles/scylla_install/files/scylladb-2026.asc'
        fail_msg: >-
          Manager agent installation requires current exact Ubuntu 24.04,
          architecture, Scylla install, version, and provenance evidence.
        quiet: true
      changed_when: false
      no_log: true
      tags:
        - always
        - preflight

    - name: Emit truthful check-mode result
      ansible.builtin.debug:
        msg: >-
          DSV_MANAGER_AGENT_B64={{
            {
              'schema_version':
                'deploy-scylla-vms.ansible-manager-agent/v1',
              'logical_id': inventory_hostname,
              'status': 'not-predicted',
              'requested_release':
                deploy_scylla_vms_manager_agent.release_line,
              'requested_version':
                deploy_scylla_vms_manager_agent.package_version,
              'installed_version': none,
              'packages': {},
              'repository_digest':
                deploy_scylla_vms_manager_agent
                .repository.definition_digest,
              'signing_key_digest':
                deploy_scylla_vms_manager_agent
                .signing_key.artifact_digest,
              'signing_key_fingerprint':
                deploy_scylla_vms_manager_agent
                .signing_key.fingerprint,
              'service_enabled': none,
              'service_inactive': none,
              'configuration_performed': false,
              'auth_token_configured': false,
              'helper_slice_configured': false,
              'server_reachability': 'not-performed',
              'provenance':
                deploy_scylla_vms_manager_agent.provenance,
              'blockers': []
            }
            | to_json
            | b64encode
          }}
      when: ansible_check_mode
      changed_when: false
      tags:
        - always

    - name: Stop after non-predictive check result
      ansible.builtin.meta: end_host
      when: ansible_check_mode
      tags:
        - always

  tasks:
    - name: Create the owner-controlled APT keyring directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        owner: root
        group: root
        mode: "0755"
      tags:
        - packages

    - name: Install the vendored authenticated ScyllaDB 2026 signing key
      ansible.builtin.copy:
        src: roles/scylla_install/files/scylladb-2026.asc
        dest: /etc/apt/keyrings/scylladb-2026.asc
        owner: root
        group: root
        mode: "0644"
      register: manager_agent_key
      tags:
        - packages

    - name: Configure the exact signed Manager 3.12 repository
      ansible.builtin.deb822_repository:
        name: scylladb-manager-3-12
        types:
          - deb
        uris:
          - >-
            {{
              deploy_scylla_vms_manager_agent.repository.uri
            }}
        suites:
          - stable
        components:
          - main
        architectures:
          - >-
            {{
              'amd64'
              if deploy_scylla_vms_manager_agent.architecture == 'amd64'
              else 'arm64'
            }}
        signed_by: /etc/apt/keyrings/scylladb-2026.asc
        enabled: true
        state: present
        mode: "0644"
      register: manager_agent_repository
      tags:
        - packages

    - name: Install the exact allowlisted Manager agent package
      ansible.builtin.apt:
        name: >-
          {{
            deploy_scylla_vms_manager_agent.packages
            | map(
              'regex_replace',
              '$',
              '='
              + deploy_scylla_vms_manager_agent.package_version
            )
            | list
          }}
        state: present
        update_cache: true
        allow_downgrade: false
        force: false
        force_apt_get: true
        install_recommends: false
        policy_rc_d: 101
      register: manager_agent_packages
      tags:
        - packages

    - name: Keep the Manager agent disabled and inactive
      ansible.builtin.systemd_service:
        name: scylla-manager-agent
        enabled: false
        state: stopped
        daemon_reload: true
      register: manager_agent_service
      tags:
        - verify

    - name: Gather installed package facts
      ansible.builtin.package_facts:
        manager: apt
      changed_when: false
      no_log: true
      tags:
        - verify

    - name: Initialize normalized package evidence
      ansible.builtin.set_fact:
        manager_agent_installed_packages: {}
      changed_when: false
      no_log: true
      tags:
        - verify

    - name: Build normalized package evidence
      ansible.builtin.set_fact:
        manager_agent_installed_packages: >-
          {{
            manager_agent_installed_packages
            | combine({
              item: (
                ansible_facts.packages[item]
                | map(attribute='version')
                | unique
                | list
                | first
              )
            })
          }}
      loop: "{{ deploy_scylla_vms_manager_agent.packages }}"
      when:
        - item in ansible_facts.packages
        - >-
          ansible_facts.packages[item]
          | map(attribute='version')
          | unique
          | list
          | length == 1
      changed_when: false
      no_log: true
      tags:
        - verify

    - name: Verify the exact installed package set and versions
      ansible.builtin.assert:
        that:
          - >-
            manager_agent_installed_packages.keys()
            | list
            | sort
            ==
            deploy_scylla_vms_manager_agent.packages
          - >-
            manager_agent_installed_packages.values()
            | unique
            | list
            ==
            [deploy_scylla_vms_manager_agent.package_version]
        quiet: true
      changed_when: false
      no_log: true
      tags:
        - verify

    - name: Inspect Manager agent enablement
      ansible.builtin.command:
        argv:
          - /usr/bin/systemctl
          - is-enabled
          - scylla-manager-agent.service
      register: manager_agent_service_enabled
      changed_when: false
      failed_when: false
      no_log: true
      tags:
        - verify

    - name: Inspect Manager agent activity
      ansible.builtin.command:
        argv:
          - /usr/bin/systemctl
          - is-active
          - scylla-manager-agent.service
      register: manager_agent_service_active
      changed_when: false
      failed_when: false
      no_log: true
      tags:
        - verify

    - name: Refuse package-script startup or service enablement
      ansible.builtin.assert:
        that:
          - manager_agent_service_enabled.stdout == 'disabled'
          - manager_agent_service_active.stdout == 'inactive'
        quiet: true
      changed_when: false
      no_log: true
      tags:
        - verify

  post_tasks:
    - name: Emit strict normalized Manager agent install evidence
      ansible.builtin.debug:
        msg: >-
          DSV_MANAGER_AGENT_B64={{
            {
              'schema_version':
                'deploy-scylla-vms.ansible-manager-agent/v1',
              'logical_id': inventory_hostname,
              'status': (
                'installed'
                if (
                  manager_agent_key.changed
                  or manager_agent_repository.changed
                  or manager_agent_packages.changed
                  or manager_agent_service.changed
                )
                else 'no-change'
              ),
              'requested_release':
                deploy_scylla_vms_manager_agent.release_line,
              'requested_version':
                deploy_scylla_vms_manager_agent.package_version,
              'installed_version':
                deploy_scylla_vms_manager_agent.package_version,
              'packages': manager_agent_installed_packages,
              'repository_digest':
                deploy_scylla_vms_manager_agent
                .repository.definition_digest,
              'signing_key_digest':
                deploy_scylla_vms_manager_agent
                .signing_key.artifact_digest,
              'signing_key_fingerprint':
                deploy_scylla_vms_manager_agent
                .signing_key.fingerprint,
              'service_enabled': false,
              'service_inactive': true,
              'configuration_performed': false,
              'auth_token_configured': false,
              'helper_slice_configured': false,
              'server_reachability': 'not-performed',
              'provenance':
                deploy_scylla_vms_manager_agent.provenance,
              'blockers': []
            }
            | to_json
            | b64encode
          }}
      changed_when: false
      no_log: false
      tags:
        - always
