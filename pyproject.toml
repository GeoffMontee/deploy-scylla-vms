[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "deploy-scylla-vms"
version = "26.9.1"
description = "Safe ScyllaDB VM deployment and operations CLI"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "deploy-scylla-vms contributors" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = ["platformdirs"]

[project.optional-dependencies]
dev = [
  "ansible-core>=2.17,<2.21; python_version < '3.14'",
  "ansible-core>=2.20,<2.21; python_version >= '3.14'",
  "ansible-lint>=25,<27",
  "build",
  "mypy",
  "pytest",
  "ruff",
  "yamllint>=1.35,<2",
]

[project.scripts]
deploy-scylla-vms = "scylla_vms.cli:main"

[tool.setuptools.packages.find]
include = ["scylla_vms*"]

[tool.setuptools.package-data]
"scylla_vms.terraform" = [
  "bundles/oci_root/*.tf",
  "bundles/oci_root/.terraform.lock.hcl",
]
"scylla_vms.ansible" = [
  "content/ansible.cfg",
  "content/**/*.asc",
  "content/**/*.j2",
  "content/**/*.py",
  "content/**/*.yml",
]

[tool.pytest.ini_options]
addopts = "-ra -m 'not real_device'"
markers = [
  "real_device: requires an explicitly approved isolated real-device host",
]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["scylla_vms", "deploy_scylla_vms.py"]
